name: trading-agent

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: ta-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/000-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader} -d ${POSTGRES_DB:-trading}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ta-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: ta-api
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/live').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  ticker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: ta-ticker
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    volumes:
      - ./backend:/app
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.market.ticker"]
    restart: unless-stopped

  agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: ta-agent
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    volumes:
      - ./backend:/app
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.agent.worker"]
    restart: unless-stopped

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: ta-bot
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    volumes:
      - ./backend:/app
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.notify.bot"]
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: ta-web
    ports:
      - "${WEB_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  web_node_modules:
