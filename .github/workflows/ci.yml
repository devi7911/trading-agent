# Continuous integration for every branch in the dev -> sit -> pat -> main path.
#
# The backend suite is not a unit-test suite: the ledger tests place hundreds of
# orders against a real Postgres and replay the fill history, which is the whole
# point of them. So CI runs the same TimescaleDB and Redis the compose stack
# runs, applies the migrations, and executes the suite against them.

name: CI

on:
  push:
    branches: [main, dev, sit, pat]
  pull_request:
    branches: [main, dev, sit, pat]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, migrate, test
    runs-on: ubuntu-latest

    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader
          POSTGRES_DB: trading
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trader -d trading"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The services are published on the runner's own network, not compose's.
      POSTGRES_HOST: localhost
      REDIS_HOST: localhost
      # A throwaway key that satisfies the 32-byte HS256 minimum. Real
      # deployments read this from the environment's secrets, never from here.
      SECRET_KEY: ci-only-key-not-a-secret-padded-to-32-bytes
      APP_ENV: test
      ALLOW_LIVE_TRADING: 'false'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Migrate
        run: alembic upgrade head

      - name: Seed the market
        # Without this, every test that needs instruments - the ledger
        # reconciliation gate, the agent loop, the backtest - calls
        # pytest.skip and the build goes green having verified none of them.
        # A smaller universe and less history than a local seed: enough for
        # the 200-session windows the strategies need, fast enough for CI.
        run: python -m app.cli seed-market --count 24 --years 3

      - name: Test
        run: pytest -q -rs --junitxml=/tmp/report.xml

      - name: No test may skip in CI
        # A skip here means the environment is wrong - an unseeded database,
        # a missing service - not that a test is optional. Silent skips are
        # how a green build comes to certify nothing.
        run: |
          python - <<'EOF'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse('/tmp/report.xml').getroot()
          suite = root if root.tag == 'testsuite' else root.find('testsuite')
          skipped = int(suite.get('skipped', '0'))
          total = int(suite.get('tests', '0'))
          print(f'{total} tests, {skipped} skipped')
          if skipped:
              for case in suite.iter('testcase'):
                  if case.find('skipped') is not None:
                      print(f"  skipped: {case.get('classname')}::{case.get('name')}")
              sys.exit('Tests were skipped in CI. Fix the environment, not the assertion.')
          EOF

  frontend:
    name: Frontend - production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        # The production build is the type check that matters: the dev server
        # tolerates things the optimiser silently erases, which is how a
        # type-only import once made every chart render blank.
        run: npm run build -- --configuration production

  promote:
    # The environment gate. Dev promotes automatically; SIT and PAT wait for a
    # reviewer, so nothing reaches them on a green build alone. The environment
    # name is the branch name, which is why the branches are called dev/sit/pat.
    name: Promote to ${{ github.ref_name }}
    if: >-
      github.event_name == 'push' &&
      contains(fromJSON('["dev","sit","pat"]'), github.ref_name)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v5
      - name: Record what was promoted
        run: |
          echo "### Promoted to ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Backend suite and frontend production build both green." >> "$GITHUB_STEP_SUMMARY"
