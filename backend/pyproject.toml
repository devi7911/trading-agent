[project]
name = "trading-agent-api"
version = "0.1.0"
description = "Agentic trading desk - API and agent runtime"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "redis>=5.2",
  "structlog>=24.4",
  "httpx>=0.28",
  "numpy>=2.1",
  "typer>=0.15",
  "openpyxl>=3.1",
  "reportlab>=4.2",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"alembic/*" = ["E501"]
# The sector table is aligned on purpose; column alignment beats the line limit.
"app/market/synthetic/universe.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: needs a live Postgres (run inside compose: docker compose exec api pytest)",
  "slow: long-running; deselect with -m 'not slow'",
]

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true
